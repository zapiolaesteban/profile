# Netlify config for estebangz.com
# Static single-file site (no build step) + one serverless function for the agent.

[build]
  command = ""          # no build — it's hand-coded HTML
  publish = "."         # serve repo root
  functions = "netlify/functions"

# Bundle the knowledge base so the agent function can read it at runtime.
[functions]
  included_files = ["knowledge/esteban.md"]
  node_bundler = "esbuild"

# Friendly endpoint: POST /api/ask -> the agent function
[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

# Old CV filename → new full-name file (keeps shared links and bookmarks alive)
[[redirects]]
  from = "/Esteban-GZ-Resume.pdf"
  to = "/Esteban-Gimenez-Zapiola-Creative-Director-CV.pdf"
  status = 301

# World Clock lives in its own repo (zapiolaesteban/world-clock, served by GitHub Pages).
# Proxied here so estebangz.com/world-clock/ is the one address to remember; the repo stays
# the single source of truth and every merge there shows up here with no deploy on this side.
# Rules run top to bottom, first match wins: the two 301s send old/odd URLs to the trailing-slash
# form so the page's relative links (manifest, ?mini=1) keep resolving. Do NOT add a bare
# "/world-clock" -> "/world-clock/" rule: Netlify matches `from` with or without the trailing
# slash, so that rule also catches "/world-clock/" and loops on itself (seen on deploy preview 19).
[[redirects]]
  from = "/world-clock/v2/*"
  to = "/world-clock/:splat"
  status = 301

[[redirects]]
  from = "/world-clock.html"
  to = "/world-clock/"
  status = 301

[[redirects]]
  from = "/world-clock/*"
  to = "https://zapiolaesteban.github.io/world-clock/:splat"
  status = 200
